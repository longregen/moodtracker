name: Generate App Screenshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to generate screenshots from (leave empty for current branch)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build debug APK
        run: |
          nix develop --command bash -c '
            echo "Building MoodTracker APK for screenshots"
            echo "Environment setup:"
            echo "  ANDROID_HOME: $ANDROID_HOME"
            echo "  JAVA_HOME: $JAVA_HOME"

            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --parallel \
              --build-cache \
              --configuration-cache \
              --no-daemon \
              --stacktrace
          '

      - name: List generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: error

  screenshots:
    name: Generate Screenshots
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: debug-apk
          path: apk

      - name: List downloaded APKs
        run: ls -lh apk/

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create screenshots directory
        run: mkdir -p screenshots

      - name: Create screenshot script
        run: |
          cat > take-screenshots.sh << 'SCRIPT_EOF'
          #!/bin/bash
          set -e

          # Get the APK path
          APK_PATH=$(find apk -name "app-x86_64-debug.apk" 2>/dev/null | head -n 1)
          [ -z "$APK_PATH" ] && APK_PATH=$(find apk -name "app-debug.apk" 2>/dev/null | head -n 1)
          [ -z "$APK_PATH" ] && APK_PATH=$(find apk -name "*.apk" 2>/dev/null | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found"
            ls -la apk/ || echo "apk directory not found"
            exit 1
          fi

          echo "Using APK: $APK_PATH"

          # Wait for emulator to be ready
          echo "Waiting for emulator to boot..."
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          sleep 5

          # Install the APK
          echo "Installing APK..."
          adb install -r "$APK_PATH"

          # Grant necessary permissions
          echo "Granting permissions..."
          adb shell pm grant com.moodtracker android.permission.POST_NOTIFICATIONS || true
          adb shell pm grant com.moodtracker android.permission.SCHEDULE_EXACT_ALARM || true

          # Disable animations for consistent screenshots
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          # Set screen to stay on
          adb shell settings put system screen_off_timeout 600000

          # Launch the app
          echo "Launching app..."
          adb shell am start -n com.moodtracker/.MainActivity -a android.intent.action.MAIN -c android.intent.category.LAUNCHER

          # Wait for app to fully load
          echo "Waiting for app to load..."
          sleep 8

          # Ensure screen is on
          adb shell input keyevent KEYCODE_WAKEUP
          sleep 1

          # Screenshot 1: Main Screen (default landing screen)
          echo "Taking screenshot of Main screen..."
          adb shell screencap -p /sdcard/main_screen.png
          adb pull /sdcard/main_screen.png screenshots/main_screen.png
          sleep 2

          # Get screen dimensions for calculating tap positions
          SCREEN_SIZE=$(adb shell wm size | grep -oP 'Physical size: \K.*')
          echo "Screen size: $SCREEN_SIZE"
          WIDTH=$(echo $SCREEN_SIZE | cut -d'x' -f1)
          HEIGHT=$(echo $SCREEN_SIZE | cut -d'x' -f2)

          # Calculate bottom navigation positions
          NAV_Y=$((HEIGHT - 120))

          # Tab positions (divided into 4 equal sections)
          TAB1_X=$((WIDTH / 8))
          TAB2_X=$((3 * WIDTH / 8))
          TAB3_X=$((5 * WIDTH / 8))
          TAB4_X=$((7 * WIDTH / 8))

          echo "Navigation Y position: $NAV_Y"
          echo "Tab positions - Main: $TAB1_X, Logs: $TAB2_X, Notifications: $TAB3_X, Config: $TAB4_X"

          # Screenshot 2: Logs Screen
          echo "Navigating to Logs screen..."
          adb shell input tap $TAB2_X $NAV_Y
          sleep 3
          echo "Taking screenshot of Logs screen..."
          adb shell screencap -p /sdcard/logs_screen.png
          adb pull /sdcard/logs_screen.png screenshots/logs_screen.png
          sleep 2

          # Screenshot 3: Notifications Screen
          echo "Navigating to Notifications screen..."
          adb shell input tap $TAB3_X $NAV_Y
          sleep 3
          echo "Taking screenshot of Notifications screen..."
          adb shell screencap -p /sdcard/notifications_screen.png
          adb pull /sdcard/notifications_screen.png screenshots/notifications_screen.png
          sleep 2

          # Screenshot 4: Config Screen
          echo "Navigating to Config screen..."
          adb shell input tap $TAB4_X $NAV_Y
          sleep 3
          echo "Taking screenshot of Config screen..."
          adb shell screencap -p /sdcard/config_screen.png
          adb pull /sdcard/config_screen.png screenshots/config_screen.png
          sleep 2

          # Return to Main screen
          echo "Returning to Main screen..."
          adb shell input tap $TAB1_X $NAV_Y
          sleep 2

          # Cleanup screenshots from device
          adb shell rm /sdcard/*.png

          echo "Screenshot generation complete!"
          ls -lh screenshots/
          SCRIPT_EOF
          chmod +x take-screenshots.sh

      - name: Generate screenshots with Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./take-screenshots.sh

      - name: Verify screenshots were created
        run: |
          echo "Verifying screenshots..."
          ls -lh screenshots/

          # Check if all 4 screenshots exist
          for screen in main_screen logs_screen notifications_screen config_screen; do
            if [ ! -f "screenshots/${screen}.png" ]; then
              echo "Error: ${screen}.png was not created"
              exit 1
            fi
            echo "✓ ${screen}.png exists ($(du -h screenshots/${screen}.png | cut -f1))"
          done

      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@v5
        with:
          name: app-screenshots-${{ github.run_number }}
          path: screenshots/*.png
          retention-days: 90
          if-no-files-found: error

      - name: Create Pull Request with screenshots
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Update app screenshots

            - Add main screen screenshot
            - Add logs screen screenshot
            - Add notifications screen screenshot
            - Add config screen screenshot

            Generated automatically from workflow run ${{ github.run_number }}
          branch: screenshots-update-${{ github.run_number }}
          delete-branch: true
          title: 'Update app screenshots'
          body: |
            ## App Screenshots Update

            This PR adds updated screenshots of the MoodTracker app.

            ### Screenshots Added

            - **Main Screen** (`screenshots/main_screen.png`) - The main dashboard showing mood tracking overview
            - **Logs Screen** (`screenshots/logs_screen.png`) - Historical mood entries and logs
            - **Notifications Screen** (`screenshots/notifications_screen.png`) - Notification schedule configuration
            - **Config Screen** (`screenshots/config_screen.png`) - App settings and configuration

            ### Details

            - **Generated from**: `${{ github.event.inputs.branch || github.ref_name }}`
            - **Workflow run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Emulator**: Pixel 6, Android API 33 (x86_64)
            - **Build**: ${{ github.sha }}

            ### Preview

            You can download the screenshots from the workflow artifacts or view them in this PR once merged.

            ---

            *Generated automatically by the Screenshot Workflow*
          labels: |
            documentation
            screenshots
            automated
          assignees: ${{ github.actor }}

      - name: Output PR information
        run: |
          echo "========================================="
          echo "Screenshot generation workflow completed!"
          echo "========================================="
          echo ""
          echo "Screenshots have been:"
          echo "  1. Generated from the app running in an Android emulator"
          echo "  2. Uploaded as workflow artifacts"
          echo "  3. Committed to a new branch and PR created"
          echo ""
          echo "Check the Actions tab for the workflow artifacts."
          echo "Check the Pull Requests tab for the automated PR."
          echo ""

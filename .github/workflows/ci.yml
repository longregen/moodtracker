name: CI - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Lightweight build check for PRs - just compile, no emulator or E2E tests
  build-check:
    name: Build Check (Nix)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build debug APK
        run: |
          nix develop --command bash -c '
            echo "Environment setup:"
            echo "  ANDROID_HOME: $ANDROID_HOME"
            echo "  JAVA_HOME: $JAVA_HOME"

            chmod +x ./gradlew

            # Build only arm (faster) for PR checks
            ./gradlew assembleDebug \
              -Pandroid.injected.abi=armeabi-v7a \
              --parallel \
              --build-cache \
              --configuration-cache \
              --no-daemon \
              --stacktrace
          '

      - name: Run unit tests
        run: |
          nix develop --command bash -c '
            ./gradlew test --no-daemon || echo "No unit tests found or tests failed"
          '

  # E2E tests only run on main branch pushes
  e2e-test:
    name: E2E Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/e2e-test.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      artifact-name-prefix: 'ci-e2e'
